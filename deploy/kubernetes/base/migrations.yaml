apiVersion: batch/v1
kind: Job
metadata:
  generateName: mitte-migrate-
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mitte-migrate
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ghcr.io/REPLACE_WITH_OWNER/mitte@sha256:REPLACE_WITH_RELEASE_DIGEST
          command: ["/mitte-migrate"]
          envFrom:
            - configMapRef:
                name: mitte-runtime
          env:
            - name: APP_COMPONENT
              value: migrate
            - name: RUN_MIGRATIONS
              value: "true"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: mitte-secrets
                  key: DATABASE_URL
            - name: DB_MAX_OPEN_CONNS
              value: "2"
            - name: DB_MAX_IDLE_CONNS
              value: "1"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
