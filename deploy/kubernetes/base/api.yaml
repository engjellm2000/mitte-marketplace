apiVersion: apps/v1
kind: Deployment
metadata:
  name: mitte-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: mitte-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mitte-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8080"
    spec:
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: mitte-api
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: mitte-api
      containers:
        - name: api
          image: ghcr.io/REPLACE_WITH_OWNER/mitte@sha256:REPLACE_WITH_RELEASE_DIGEST
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
            - name: grpc-health
              containerPort: 9090
          envFrom:
            - configMapRef:
                name: mitte-runtime
          env:
            - name: APP_COMPONENT
              value: web
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: mitte-secrets
                  key: DATABASE_URL
            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: mitte-secrets
                  key: STRIPE_SECRET_KEY
            - name: STRIPE_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: mitte-secrets
                  key: STRIPE_WEBHOOK_SECRET
            - name: METRICS_BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mitte-secrets
                  key: METRICS_BEARER_TOKEN
            - name: STAFF_CREDENTIALS
              valueFrom:
                secretKeyRef:
                  name: mitte-secrets
                  key: STAFF_CREDENTIALS
            - name: STAFF_ROLES
              valueFrom:
                secretKeyRef:
                  name: mitte-secrets
                  key: STAFF_ROLES
            - name: INVOICE_SELLER_IBAN
              valueFrom:
                secretKeyRef:
                  name: mitte-secrets
                  key: INVOICE_SELLER_IBAN
                  optional: true
            - name: DB_MAX_OPEN_CONNS
              value: "5"
            - name: DB_MAX_IDLE_CONNS
              value: "2"
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: mitte-api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mitte-api
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mitte-storefront
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "30"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - shop.example.com
      secretName: mitte-tls
  rules:
    - host: shop.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mitte-api
                port:
                  name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mitte-api-rate-limit
  annotations:
    nginx.ingress.kubernetes.io/limit-rps: "10"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "3"
    nginx.ingress.kubernetes.io/limit-req-status-code: "429"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - shop.example.com
      secretName: mitte-tls
  rules:
    - host: shop.example.com
      http:
        paths:
          - path: /api/
            pathType: Prefix
            backend:
              service:
                name: mitte-api
                port:
                  name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mitte-auth-rate-limit
  annotations:
    nginx.ingress.kubernetes.io/limit-rps: "1"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "3"
    nginx.ingress.kubernetes.io/limit-req-status-code: "429"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - shop.example.com
      secretName: mitte-tls
  rules:
    - host: shop.example.com
      http:
        paths:
          - path: /api/auth/
            pathType: Prefix
            backend:
              service:
                name: mitte-api
                port:
                  name: http
          - path: /api/staff/login
            pathType: Exact
            backend:
              service:
                name: mitte-api
                port:
                  name: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: mitte-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mitte-api
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: mitte-api
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: mitte-api
