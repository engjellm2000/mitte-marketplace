apiVersion: apps/v1
kind: Deployment
metadata:
  name: mitte-oms
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: mitte-oms
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mitte-oms
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8081"
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: mitte-oms
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: mitte-oms
      containers:
        - name: oms
          image: ghcr.io/REPLACE_WITH_OWNER/mitte@sha256:REPLACE_WITH_RELEASE_DIGEST
          command: ["/mitte-oms"]
          ports:
            - name: http
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: mitte-runtime
          env:
            - name: APP_COMPONENT
              value: oms
            - name: OMS_PORT
              value: "8081"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: mitte-secrets
                  key: DATABASE_URL
            - name: OMS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: mitte-secrets
                  key: OMS_API_KEY
            - name: OMS_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mitte-secrets
                  key: OMS_USERNAME
            - name: OMS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mitte-secrets
                  key: OMS_PASSWORD
            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: mitte-secrets
                  key: STRIPE_SECRET_KEY
            - name: METRICS_BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mitte-secrets
                  key: METRICS_BEARER_TOKEN
            - name: DB_MAX_OPEN_CONNS
              value: "3"
            - name: DB_MAX_IDLE_CONNS
              value: "1"
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: mitte-oms
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mitte-oms
  ports:
    - name: http
      port: 8081
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: mitte-oms
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mitte-oms
