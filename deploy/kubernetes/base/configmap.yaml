apiVersion: v1
kind: ConfigMap
metadata:
  name: mitte-runtime
data:
  APP_ENV: production
  PORT: "8080"
  GRPC_LISTEN_ADDR: ":9090"
  TRUSTED_HOSTS: shop.example.com
  # This value must be replaced in a protected environment overlay with the
  # CIDR(s) of the reverse proxy that connects directly to the web pods.
  # The application deliberately refuses to start with this placeholder.
  TRUSTED_PROXY_CIDRS: REPLACE_WITH_INGRESS_PROXY_CIDRS
  PUBLIC_BASE_URL: https://shop.example.com
  STRIPE_SUCCESS_URL: https://shop.example.com/bestellung/erfolg?session_id={CHECKOUT_SESSION_ID}
  STRIPE_CANCEL_URL: https://shop.example.com/warenkorb
  INVOICE_SELLER_NAME: REPLACE_WITH_VERIFIED_SELLER_NAME
  INVOICE_SELLER_STREET: REPLACE_WITH_VERIFIED_SELLER_STREET
  INVOICE_SELLER_POSTAL_CODE: REPLACE_WITH_VERIFIED_POSTAL_CODE
  INVOICE_SELLER_CITY: REPLACE_WITH_VERIFIED_CITY
  INVOICE_SELLER_COUNTRY_CODE: DE
  INVOICE_SELLER_VAT_ID: REPLACE_WITH_VERIFIED_VAT_ID
  INVOICE_SELLER_EMAIL: REPLACE_WITH_VERIFIED_INVOICE_EMAIL
  KAFKA_BROKERS: kafka.example.internal:9092
  KAFKA_ORDER_TOPIC: mitte.orders.v1
  KAFKA_TLS_CA_CERT: ""
  ORDER_RELAY_ENABLED: "true"
  SMTP_ADDRESS: smtp.example.internal:587
  SMTP_FROM: Mitte <shop@example.com>
  RUN_MIGRATIONS: "false"
  MITTE_PAY_SANDBOX_ENABLED: "false"
  MITTE_INVOICE_SANDBOX_ENABLED: "false"
  MITTE_TRANSFER_ENABLED: "false"
  REQUEST_TIMEOUT: 10s
  SHUTDOWN_TIMEOUT: 30s
