      THESIS: MITTE makes a broad German marketplace feel easy to search, compare, and shop without hiding the real catalog.
      OWN-WORLD: white retail surfaces, deep ink-blue navigation, warm category photography, citrus action markers, rounded product imagery, and crisp merchant labels.
      STORY: shoppers search across departments, browse a deep category tree, compare live catalog prices and stock, and check out through the existing commerce flow.
      FIRST VIEWPORT: brand and a prominent full-width search share the header; a cross-category promise and image tiles lead into a real-sales bestseller row.
      FORM: search-first marketplace layout A from the approved MITTE Figma exploration; preserve familiar large-store navigation and comparison patterns without copying another shop's identity.
    -->
    <!--
      THESIS: Supplier actions belong beside the order line they affect; no anonymous vendor marketplace.
      OWN-WORLD: MITTE navy operations rail, white work surface, orange actions, compact Manrope data.
      STORY: A supplier sees only its assigned positions, their ship-to snapshot, and current OMS state.
      FIRST VIEWPORT: Queue left, selected delivery details right, explicit action controls beside the address.
      FORM: Supplier order register within the established MITTE OMS identity; task-led detail pane.
