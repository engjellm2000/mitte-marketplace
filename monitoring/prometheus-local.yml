global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

rule_files:
  - /etc/prometheus/rules/mitte.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [prometheus:9090]
  - job_name: blackbox-exporter
    static_configs:
      - targets: [blackbox-exporter:9115]
  - job_name: alertmanager
    static_configs:
      - targets: [alertmanager:9093]
  - job_name: grafana
    static_configs:
      - targets: [grafana:3000]
  - job_name: loki
    static_configs:
      - targets: [loki:3100]
  - job_name: tempo
    static_configs:
      - targets: [tempo:3200]
  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ["http://app:8080/healthz"]
        labels:
          service: storefront
          probe: liveness
      - targets: ["http://app:8080/readyz"]
        labels:
          service: storefront
          probe: readiness
      - targets: ["http://oms:8081/readyz"]
        labels:
          service: oms
          probe: readiness
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
  - job_name: mitte
    metrics_path: /metrics
    static_configs:
      - targets: ["app:8080"]
  - job_name: mitte-oms
    metrics_path: /metrics
    static_configs:
      - targets: ["oms:8081"]
  - job_name: mitte-order-relay
    metrics_path: /metrics
    static_configs:
      - targets: ["order-relay:9464"]
  - job_name: mitte-email-relay
    metrics_path: /metrics
    static_configs:
      - targets: ["email-relay:9464"]
  - job_name: mitte-payment-expiry
    metrics_path: /metrics
    static_configs:
      - targets: ["payment-expiry:9464"]
  - job_name: otel-collector
    static_configs:
      - targets: [otel-collector:8888]
