{{define "base"}}
<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Mitte - bewusst ausgewählte Dinge für einen gut gestalteten Alltag.">
  <meta name="csrf-token" content="{{.CSRFToken}}">
  <title>{{.PageTitle}}</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div class="announcement">Kostenloser Versand in Deutschland ab 75 € <span>·</span> 30 Tage Rückgabe</div>
  <header class="site-header">
    <a class="wordmark" href="/" aria-label="Mitte Startseite">Mitte</a>
    <nav class="main-nav" aria-label="Hauptnavigation">
      <a class="{{if eq .ActivePage "home"}}is-active{{end}}" href="/">Neu</a>
      <a class="{{if eq .ActivePage "shop"}}is-active{{end}}" href="/shop">Shop</a>
      <a href="/shop?kategorie=wohnen">Wohnen</a>
      <a href="/shop?kategorie=tisch">Tisch</a>
    </nav>
    <a class="cart-link {{if eq .ActivePage "cart"}}is-active{{end}}" href="/warenkorb">Warenkorb <span id="cart-count" aria-label="{{.CartCount}} Artikel">{{.CartCount}}</span></a>
  </header>
  <main>
    {{template "content" .}}
  </main>
  <footer class="site-footer">
    <div>
      <a class="wordmark footer-mark" href="/">Mitte</a>
      <p>Dinge, die sich gut anf&uuml;hlen und lange bleiben.</p>
    </div>
    <div class="footer-links">
      <a href="/shop">Alle Produkte</a>
      <a href="/shop?kategorie=textil">Textil</a>
      <a href="mailto:hallo@mitte.local">Kontakt</a>
    </div>
    <p class="footer-note">Sichere Zahlung über Stripe.</p>
  </footer>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="/static/app.js" defer></script>
</body>
</html>
{{end}}
